
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- squircle clip path for macOS-style rounded rect -->
    <clipPath id="squircle">
      <path d="
        M 224,0
        C 100,0  0,100  0,224
        L 0,800
        C 0,924 100,1024 224,1024
        L 800,1024
        C 924,1024 1024,924 1024,800
        L 1024,224
        C 1024,100  924,0  800,0
        Z
      "/>
    </clipPath>
    
    <!-- subtle parchment texture -->
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f5f4ed" surfaceScale="1.5" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="light" mode="multiply"/>
    </filter>
    
    <linearGradient id="ink-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D"/>
      <stop offset="100%" stop-color="#2d5a7a"/>
    </linearGradient>
    
    <linearGradient id="ink-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B365D"/>
      <stop offset="100%" stop-color="#122a47"/>
    </linearGradient>
    
    <linearGradient id="warm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8956a"/>
    </linearGradient>
    
    <linearGradient id="vellum-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f6ef"/>
      <stop offset="50%" stop-color="#f5f4ed"/>
      <stop offset="100%" stop-color="#ede9dc"/>
    </linearGradient>
    
    <linearGradient id="olive-subtle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8b6e"/>
      <stop offset="100%" stop-color="#6b7c62"/>
    </linearGradient>

    <!-- ink drip gradient -->
    <linearGradient id="ink-drip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B365D"/>
      <stop offset="60%" stop-color="#1B365D"/>
      <stop offset="100%" stop-color="#2d5a7a" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- inner shadow for depth -->
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset dx="2" dy="4" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- soft drop shadow inside icon -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>


  <!-- Background: warm parchment with subtle gradient -->
  <rect width="1024" height="1024" fill="url(#vellum-bg)" clip-path="url(#squircle)"/>
  
  <rect width="1024" height="1024" fill="#f5f4ed" opacity="0.3" clip-path="url(#squircle)"
        style="filter:url(#paper-texture)"/>

  <!-- H Monogram -->
  <g transform="translate(512, 520)">
    
    <!-- Left stem of H - solid ink blue -->
    <rect x="-190" y="-260" width="72" height="520" rx="8" fill="url(#ink-deep)"/>
    
    <!-- Right stem of H - with subtle gradient for depth -->
    <rect x="118" y="-260" width="72" height="520" rx="8" fill="url(#ink-blue)" opacity="0.85"/>
    
    <!-- Crossbar of H -->
    <rect x="-170" y="-36" width="340" height="68" rx="8" fill="url(#ink-blue)"/>
    
    <!-- Serif detail on left top -->
    <path d="M -198,-260 L -154,-260 L -154,-272 L -210,-272 L -210,-248 Z" fill="url(#ink-deep)"/>
    
    <!-- Serif detail on left bottom -->
    <path d="M -198,260 L -154,260 L -154,272 L -210,272 L -210,248 Z" fill="url(#ink-deep)"/>
    
    <!-- Serif detail on right top -->
    <path d="M 154,-260 L 198,-260 L 210,-248 L 210,-272 L 154,-272 Z" fill="url(#ink-blue)"/>
    
    <!-- Serif detail on right bottom -->
    <path d="M 154,260 L 198,260 L 210,248 L 210,272 L 154,272 Z" fill="url(#ink-blue)"/>
    
    <!-- Decorative gold accent: small leaf/quill hint at crossbar -->
    <circle cx="140" cy="-2" r="14" fill="url(#warm-gold)" opacity="0.9"/>
    
  </g>
  
  <!-- Subtle bottom decoration line -->
  <line x1="320" y1="860" x2="704" y2="860" stroke="#c9a96e" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
</svg>