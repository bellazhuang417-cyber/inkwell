name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon (arm64)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Fix code signature
        run: |
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" | head -1)
          echo "App path: $APP"
          # Re-sign with proper deep adhoc signature so macOS shows
          # "can't verify developer" instead of "app is damaged"
          codesign --deep --force -s - "$APP"

      - name: Package
        run: |
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name "*.app" | head -1)
          DIR=$(dirname "$APP")
          NAME=$(basename "$APP")
          TAG=${{ github.ref_name }}
          cd "$DIR"
          tar -czf "Inkwell_${TAG}_aarch64.tar.gz" "$NAME"
          echo "ASSET=$DIR/Inkwell_${TAG}_aarch64.tar.gz" >> $GITHUB_ENV

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          body: |
            ## 安装说明（macOS）

            > **重要提示**：Inkwell 目前没有 Apple 官方签名，macOS 会提示"无法验证"。这不代表软件有问题，按下面的步骤可以正常安装。

            ---

            ### 方法一：一键安装（推荐）

            打开「终端」（Terminal），复制粘贴下面这行命令，回车运行：

            ```bash
            curl -fsSL https://raw.githubusercontent.com/bellazhuang417-cyber/inkwell/main/install.sh | bash
            ```

            运行完毕后，在「应用程序」文件夹里找到 Inkwell，双击即可打开。

            ---

            ### 方法二：手动安装

            1. 下载 `Inkwell_${{ github.ref_name }}_aarch64.tar.gz`
            2. 双击解压，得到 `Inkwell.app`
            3. 把 `Inkwell.app` 拖入「应用程序」文件夹
            4. **不要直接双击打开**，改为：右键点击 Inkwell.app → 选「打开」→ 弹窗里再点「打开」
            5. 之后每次双击就能正常打开了

            ---

            ### 如果还是打不开

            打开「终端」，运行：

            ```bash
            xattr -cr /Applications/Inkwell.app
            ```

            然后再双击 Inkwell.app。

            ---

            ### 首次使用

            打开后点击左上角的文件夹图标，选择你存放笔记的文件夹，即可开始使用。
